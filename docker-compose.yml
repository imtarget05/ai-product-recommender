# RecSys-AI — local smoke stack (Docker local → image Render dùng cùng Dockerfile)
# Usage:
#   docker compose up -d --build
#   curl -fsS http://localhost:8000/api/v1/health/live
#   curl -fsS http://localhost:8000/api/v1/health/ready
# Hạ tầng chốt staging: Docker local → Render → Neon → R2 → Confluent.
# Local dùng pgvector Postgres + Redis; staging/prod trỏ DATABASE_URL Neon + QDRANT_URL cloud.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: recsys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: recsys_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: recsys-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: recsys-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/recsys_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_HOST=0.0.0.0
      - API_PORT=8000
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  redis_data:
